    <script>
      // iOS reads the Home Screen status bar style at launch: black for dark mode.
      if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) {
        document.getElementById("status-bar-style").setAttribute("content", "black");
      }
      // A pairing link carries its key in the fragment. Move it out of the address
      // bar before the router boots, so it never lands in history or screenshots.
      if (/[#&]k=/.test(location.hash)) {
        try { sessionStorage.setItem("nus-study-pending-pairing", location.hash); } catch (e) {}
        history.replaceState(null, "", location.pathname + location.search);
      }
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register(new URL("sw.js", document.baseURI)).catch(() => {}));
      }
    </script>
