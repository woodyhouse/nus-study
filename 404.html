    <script>
      // iOS reads the Home Screen status bar style at launch: black for dark mode.
      if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) {
        document.getElementById("status-bar-style").setAttribute("content", "black");
      }
      // A pairing link carries its key in the fragment (never sent to a server).
      // In the installed app, move it out of the address bar before the router boots.
      if (/[#&]k=/.test(location.hash)) {
        try { sessionStorage.setItem("nus-study-pending-pairing", location.hash); } catch (e) {}
        var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
        if (standalone) {
          history.replaceState(null, "", location.pathname + location.search);
        } else {
          // Opened in the browser (e.g. from the QR): keep the link in place so
          // "Add to Home Screen" carries it, and drop the manifest so iOS uses this
          // URL instead of start_url. The app shows an install-and-pair page.
          try { sessionStorage.setItem("nus-study-install-mode", "1"); } catch (e) {}
          var manifest = document.querySelector('link[rel="manifest"]');
          if (manifest) manifest.parentNode.removeChild(manifest);
        }
      }
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register(new URL("sw.js", document.baseURI)).catch(() => {}));
      }
    </script>
